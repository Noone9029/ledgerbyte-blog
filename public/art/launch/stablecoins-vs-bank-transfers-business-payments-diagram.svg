<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Stablecoin and bank transfer cash-to-cash comparison</title><desc id="desc">Two parallel payment routes connect payer cash to recipient cash, showing additional custody, conversion and intermediary steps.</desc><rect width="1600" height="900" fill="#171717"/>
  <text x="100" y="105" fill="#f2eee5" font-family="Arial,sans-serif" font-size="42" font-weight="700">Compare the complete cash-to-cash journey</text>
  <g font-family="Arial,sans-serif"><text x="100" y="285" fill="#d99a32" font-size="30" font-weight="700">Stablecoin route</text><text x="100" y="605" fill="#f2eee5" font-size="30" font-weight="700">Bank route</text></g>
  <g fill="#242424" stroke="#d99a32" stroke-width="4"><rect x="340" y="205" width="220" height="140" rx="24"/><rect x="650" y="205" width="220" height="140" rx="24"/><rect x="960" y="205" width="220" height="140" rx="24"/><rect x="1270" y="205" width="220" height="140" rx="24"/></g>
  <g fill="#242424" stroke="#f2eee5" stroke-width="4"><rect x="340" y="525" width="220" height="140" rx="24"/><rect x="650" y="525" width="220" height="140" rx="24"/><rect x="960" y="525" width="220" height="140" rx="24"/><rect x="1270" y="525" width="220" height="140" rx="24"/></g>
  <g fill="#f2eee5" font-family="Arial,sans-serif" font-size="25" text-anchor="middle"><text x="450" y="280">Fund / convert</text><text x="760" y="280">Custody + network</text><text x="1070" y="280">Redeem / convert</text><text x="1380" y="280">Recipient cash</text><text x="450" y="600">Payment order</text><text x="760" y="600">Banks / intermediaries</text><text x="1070" y="600">FX + fees</text><text x="1380" y="600">Recipient cash</text></g>
  <g stroke="#d99a32" stroke-width="7"><path d="M560 275H630"/><path d="M870 275H940"/><path d="M1180 275H1250"/></g><g stroke="#f2eee5" stroke-width="7"><path d="M560 595H630"/><path d="M870 595H940"/><path d="M1180 595H1250"/></g>
