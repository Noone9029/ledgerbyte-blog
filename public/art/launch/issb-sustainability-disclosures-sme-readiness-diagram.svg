<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">ISSB-aligned disclosure readiness flow</title><desc id="desc">A flow from stakeholder request and scope through material risks, metrics, controls and reviewed disclosure.</desc><rect width="1600" height="900" fill="#171717"/><text x="100" y="110" fill="#f2eee5" font-family="Arial,sans-serif" font-size="42" font-weight="700">From request to reviewable disclosure</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#242424" stroke="#d99a32" stroke-width="4"><circle cx="200" cy="425" r="105"/><circle cx="500" cy="425" r="105"/><circle cx="800" cy="425" r="105"/><circle cx="1100" cy="425" r="105"/><circle cx="1400" cy="425" r="105"/></g><g fill="#f2eee5" font-size="26" font-weight="700"><text x="200" y="410">Request</text><text x="200" y="448">and scope</text><text x="500" y="410">Material risks</text><text x="500" y="448">and opportunities</text><text x="800" y="410">Metrics and</text><text x="800" y="448">methods</text><text x="1100" y="410">Controls and</text><text x="1100" y="448">evidence</text><text x="1400" y="410">Review and</text><text x="1400" y="448">disclosure</text></g></g><g stroke="#d99a32" stroke-width="8"><path d="M305 425H375"/><path d="M605 425H675"/><path d="M905 425H975"/><path d="M1205 425H1275"/></g>
  <text x="100" y="700" fill="#c9c3b8" font-family="Arial,sans-serif" font-size="28">Define the user and boundary first; disclose only what governed evidence can support.</text></svg>
