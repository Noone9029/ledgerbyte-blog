<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">MCP and A2A architecture boundaries</title><desc id="desc">An agent application uses MCP to connect to tools and context and A2A to exchange tasks with a peer agent.</desc><rect width="1600" height="900" fill="#171717"/><text x="100" y="105" fill="#f2eee5" font-family="Arial,sans-serif" font-size="42" font-weight="700">Two standards, two boundaries</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><rect x="630" y="120" width="340" height="150" rx="28" fill="#f2eee5"/><text x="800" y="210" fill="#171717" font-size="30" font-weight="700">User + agent application</text>
  <rect x="160" y="520" width="310" height="170" rx="28" fill="#242424" stroke="#d99a32" stroke-width="5"/><rect x="645" y="520" width="310" height="170" rx="28" fill="#242424" stroke="#d99a32" stroke-width="5"/><rect x="1130" y="520" width="310" height="170" rx="28" fill="#242424" stroke="#f2eee5" stroke-width="5"/><g fill="#f2eee5" font-size="28" font-weight="700"><text x="315" y="600">MCP tool server</text><text x="315" y="640">Actions</text><text x="800" y="600">MCP resource server</text><text x="800" y="640">Context</text><text x="1285" y="600">A2A peer agent</text><text x="1285" y="640">Delegated task</text></g></g>
  <path d="M720 270L360 520M800 270V520" stroke="#d99a32" stroke-width="9"/><path d="M880 270L1240 520" stroke="#f2eee5" stroke-width="9"/><text x="455" y="385" fill="#d99a32" font-family="Arial,sans-serif" font-size="30" font-weight="700">MCP</text><text x="1120" y="385" fill="#f2eee5" font-family="Arial,sans-serif" font-size="30" font-weight="700">A2A</text></svg>
