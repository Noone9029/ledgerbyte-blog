<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Cloud exit dependency map</title><desc id="desc">Seven coordinated workstreams move business function from a source cloud through a controlled bridge to a destination.</desc><rect width="1600" height="900" fill="#171717"/><text x="100" y="105" fill="#f2eee5" font-family="Arial,sans-serif" font-size="42" font-weight="700">A usable exit spans the whole service</text>
  <g font-family="Arial,sans-serif"><rect x="80" y="270" width="300" height="360" rx="48" fill="#242424" stroke="#d99a32" stroke-width="5"/><rect x="1220" y="270" width="300" height="360" rx="48" fill="#242424" stroke="#f2eee5" stroke-width="5"/><text x="230" y="455" fill="#f2eee5" font-size="31" font-weight="700" text-anchor="middle">Source cloud</text><text x="1370" y="455" fill="#f2eee5" font-size="31" font-weight="700" text-anchor="middle">Destination</text></g>
  <g fill="#2d2d2d" stroke="#d99a32" stroke-width="3"><rect x="500" y="185" width="600" height="70" rx="20"/><rect x="500" y="275" width="600" height="70" rx="20"/><rect x="500" y="365" width="600" height="70" rx="20"/><rect x="500" y="455" width="600" height="70" rx="20"/><rect x="500" y="545" width="600" height="70" rx="20"/><rect x="500" y="635" width="600" height="70" rx="20"/></g>
  <g fill="#f2eee5" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle"><text x="800" y="230">Data + formats</text><text x="800" y="320">Applications + dependencies</text><text x="800" y="410">Identity + encryption</text><text x="800" y="500">Networking + operations</text><text x="800" y="590">Contracts + cost</text><text x="800" y="680">Testing + business acceptance</text></g><path d="M380 450H500M1100 450H1220" stroke="#d99a32" stroke-width="10"/>
</svg>
