<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Controlled e-invoice lifecycle</title><desc id="desc">A six-step lifecycle from master data through transaction, validation, clearance, buyer delivery, accounting and archive.</desc><rect width="1600" height="900" fill="#171717"/><text x="100" y="110" fill="#f2eee5" font-family="Arial,sans-serif" font-size="42" font-weight="700">A controlled e-invoice lifecycle</text>
  <g fill="#242424" stroke="#d99a32" stroke-width="4"><rect x="70" y="330" width="210" height="180" rx="24"/><rect x="320" y="330" width="210" height="180" rx="24"/><rect x="570" y="330" width="210" height="180" rx="24"/><rect x="820" y="330" width="210" height="180" rx="24"/><rect x="1070" y="330" width="210" height="180" rx="24"/><rect x="1320" y="330" width="210" height="180" rx="24"/></g>
  <g fill="#f2eee5" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle"><text x="175" y="405">Master data</text><text x="175" y="445">+ transaction</text><text x="425" y="425">Validate</text><text x="675" y="405">Report or</text><text x="675" y="445">clear</text><text x="925" y="405">Deliver to</text><text x="925" y="445">buyer</text><text x="1175" y="405">Post and</text><text x="1175" y="445">reconcile</text><text x="1425" y="405">Archive</text><text x="1425" y="445">evidence</text></g><path d="M280 420H320M530 420H570M780 420H820M1030 420H1070M1280 420H1320" stroke="#d99a32" stroke-width="8"/>
  <text x="100" y="700" fill="#c9c3b8" font-family="Arial,sans-serif" font-size="28">Corrections and outages follow versioned, jurisdiction-specific procedures—not manual edits.</text></svg>
