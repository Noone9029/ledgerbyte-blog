<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">AI workflow unit economics</title><desc id="desc">A flow from business event through retrieval, model, tools and human review to an outcome, with all costs allocated to the successful unit.</desc><rect width="1600" height="900" fill="#171717"/><text x="100" y="105" fill="#f2eee5" font-family="Arial,sans-serif" font-size="42" font-weight="700">Measure the complete AI workflow</text>
  <g fill="#242424" stroke="#d99a32" stroke-width="4"><rect x="90" y="310" width="220" height="180" rx="24"/><rect x="350" y="310" width="220" height="180" rx="24"/><rect x="610" y="310" width="220" height="180" rx="24"/><rect x="870" y="310" width="220" height="180" rx="24"/><rect x="1130" y="310" width="220" height="180" rx="24"/></g><rect x="1160" y="630" width="320" height="120" rx="24" fill="#f2eee5"/>
  <g fill="#f2eee5" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle"><text x="200" y="390">Business event</text><text x="460" y="390">Retrieval + data</text><text x="720" y="390">Model + tokens</text><text x="980" y="390">Tools + review</text><text x="1240" y="390">Verified outcome</text></g><text x="1320" y="700" fill="#171717" font-family="Arial,sans-serif" font-size="27" font-weight="700" text-anchor="middle">Cost per successful unit</text><path d="M310 400H350M570 400H610M830 400H870M1090 400H1130M1240 490V630" stroke="#d99a32" stroke-width="8"/>
</svg>
